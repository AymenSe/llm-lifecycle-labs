[project]
name = "lmlab"
version = "0.1.0"
description = "From-scratch LLM training lifecycle labs: pretraining to RL on a 135M model."
readme = "README.md"
authors = [
    { name = "AymenSe", email = "asekhri.pro@gmail.com" }
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "mlflow>=3.17,<3.18",
    "numpy>=2.5.4",
    "nvidia-ml-py>=13.615.71",
    "psutil>=7.2.2",
    "pyyaml>=6.0.3",
]

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]


[project.optional-dependencies]
cpu   = ["torch==2.13.0"]
cu126 = ["torch==2.13.0"]

[tool.uv]
environments = ["sys_platform == 'linux'"]
conflicts = [[{ extra = "cpu" }, { extra = "cu126" }]]

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu",   extra = "cpu" },
  { index = "pytorch-cu126", extra = "cu126" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true
